name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development tool
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Unit and repository checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
      - name: Validate Compose profiles
        run: |
          python scripts/manage.py init
          docker compose --profile cloudflare config --quiet

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "gitleaks.tar.gz"
          assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ["GITLEAKS_SHA256"]
          PY
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install backup tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
      - name: Configure disposable project
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          value = Path(".env.example").read_text()
          changes = {"COMPOSE_PROJECT_NAME=anime-stack": "COMPOSE_PROJECT_NAME=anime-stack-test-ci", "PUID=1000": f"PUID={os.getuid()}", "PGID=1000": f"PGID={os.getgid()}"}
          for before, after in changes.items():
              value = value.replace(before, after)
          Path(".env").write_text(value)
          Path(".env").chmod(0o600)
          PY
          python scripts/manage.py init
          python scripts/manage.py check
      - name: Deploy and verify private applications
        run: |
          python scripts/manage.py up
          python scripts/manage.py verify
      - name: Exercise guard and encrypted recovery
        env:
          ANIME_STACK_TESTING: "1"
        run: python tests/integration.py
      - name: Remove disposable containers
        if: always()
        run: docker compose down --timeout 60
